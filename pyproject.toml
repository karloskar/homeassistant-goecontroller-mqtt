[project]
name = "homeassistant-goecontroller-mqtt"
version = "0.1.0"
description = "A Home Assistant custom component for the go-eController"
readme = "README.md"
authors = [
    {name = "KO. Mattsson", email = "karloskarmattsson@gmail.com"},
]
license = {text = "MIT"}
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-homeassistant-custom-component==0.13.364",
    "aiohttp-cors<1.0.0,>=0.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E711", "E712"]
